project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!materials/"
  resources:
    - materials/slides.html
  execute-dir: project

website:
  title: "Using LLMs in R with ellmer"
  navbar:
    background: dark
    right:
      - icon: file-certificate
        href: license-web.qmd
      - icon: github
        href: https://github.com/thisisnic/ellmer-latinr
        text: GitHub

    left:
      - href: index.qmd
        text: Home
      - text: Slides
        href: materials/slides.html
      - text: Code
        menu:
          - text: "0: Welcome and Setup"
            href: code/00-welcome-and-setup.qmd
          - text: "1: Getting Started with LLMs in R"
            href: code/01-getting-started.qmd
          - text: "2: Prompt Engineering"
            href: code/02-prompt-engineering.qmd
          - text: "3: Extracting Structured Data"
            href: code/03-structured-data.qmd
          - text: "4: Tool Calling"
            href: code/04-tool-calling.qmd
          - text: "5 (Bonus): Other Libraries for LLMs in R"
            href: code/05-other-libraries.qmd

format:
  html:
    theme: cosmo
    css: styles.scss
    toc: true
    link-external-newwindow: true

editor: source
engine: knitr
execute:
  freeze: auto
